name : CI Tests

on:
  pull_request:
    branches: [main]
   
    
  push:
    branches: [main]
   
jobs:

  test-backend:
    
    name: Backend Tests
    
    
    runs-on: ubuntu-latest
    
   
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install dependencies
        run: npm ci
        
        
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
    
      
      - name: Build frontend
        run: npm run build